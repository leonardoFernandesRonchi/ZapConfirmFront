name: CI/CD Frontend

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t frontend .

      # # opcional (só se tiver teste configurado)
      # - name: Rodar testes
      #   run: docker run --rm frontend npm test

  push-image:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build da imagem final
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest .

      - name: Push da imagem
        run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest
